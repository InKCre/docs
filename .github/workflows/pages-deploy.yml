name: Pages deployment

on:
  workflow_run:
    workflows:
      - Website checks
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Website checks run containing inkcre-website-dist
        required: true
        type: number

permissions:
  actions: read
  contents: read

jobs:
  identity:
    name: Resolve trusted production identity
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.identity.outputs.head_sha }}
      run_id: ${{ steps.identity.outputs.run_id }}
    steps:
      - name: Resolve the exact current main artifact
        id: identity
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runId = context.eventName === 'workflow_dispatch'
              ? Number(context.payload.inputs.run_id)
              : context.payload.workflow_run.id
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            })
            if (run.name !== 'Website checks' || run.path !== '.github/workflows/website-check.yml') {
              core.setFailed('Artifact must come from the trusted Website checks workflow.')
              return
            }
            if (run.conclusion !== 'success' || run.head_branch !== 'main') {
              core.setFailed('Production delivery requires a successful main run.')
              return
            }
            const currentMain = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            })
            if (currentMain.data.object.sha !== run.head_sha) {
              core.setFailed('Production delivery requires the current exact main head.')
              return
            }
            core.setOutput('head_sha', run.head_sha)
            core.setOutput('run_id', String(runId))

  deploy:
    name: Deploy checked website artifact
    needs: identity
    concurrency:
      group: pages-main
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://inkcre.dev
    steps:
      - name: Checkout the trusted delivery controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: controller
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: controller/website/package.json

      - name: Download the exact checked artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: inkcre-website-dist
          path: .pages-delivery/dist
          run-id: ${{ needs.identity.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reverify main before delivery
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_HEAD_SHA: ${{ needs.identity.outputs.head_sha }}
        with:
          script: |
            const currentMain = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            })
            if (currentMain.data.object.sha !== process.env.RELEASE_HEAD_SHA) {
              core.setFailed('Main changed after artifact selection; refusing delivery.')
            }

      - name: Ensure the Pages project
        run: node controller/website/scripts/configure-pages.mjs project
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_DOMAIN: inkcre.dev
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}

      - name: Deploy to Cloudflare Pages
        id: pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: 4.114.0
          workingDirectory: .pages-delivery
          command: >-
            pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main

      - name: Ensure the custom domain
        run: node controller/website/scripts/configure-pages.mjs domain
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_DOMAIN: inkcre.dev
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}

      - name: Smoke-test Pages and inkcre.dev
        run: node controller/website/scripts/verify-pages-deployment.mjs
        env:
          CLOUDFLARE_PAGES_DEPLOYMENT_ID: ${{ steps.pages.outputs.pages-deployment-id }}
          CLOUDFLARE_PAGES_DEPLOYMENT_URL: ${{ steps.pages.outputs.deployment-url }}
          INKCRE_WEBSITE_ORIGIN: https://inkcre.dev
