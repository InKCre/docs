name: Website checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned pnpm release
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: website/package.json

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: website/package.json
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install the frozen website package
        run: pnpm --dir website install --frozen-lockfile

      - name: Verify the website contract
        run: pnpm --dir website check

      - name: Upload the exact checked website artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inkcre-website-dist
          path: website/.vitepress/dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
