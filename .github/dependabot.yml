version: 2

updates:
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    target-branch: main
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: main
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
